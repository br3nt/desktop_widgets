[package]
name = "desktop-widgets"
version = "0.1.0"
edition = "2021"
description = "Desktop widgets host: native capsule casings, snapping, shade mode, docks."
license = "MIT"

[[bin]]
name = "desktop-widgets"
path = "src/main.rs"

[dependencies]
winit = "0.30"
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd"] }
ab_glyph = "0.2"
wry = "0.57"
tray-icon = "0.26"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
dirs = "6"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
objc2-quartz-core = "0.3"
objc2-core-graphics = "0.3"
objc2-core-foundation = "0.3"

# On macOS the host presents premultiplied RGBA through its own CALayer (softbuffer's
# CoreGraphics path is opaque); elsewhere softbuffer does the presenting.
[target.'cfg(not(target_os = "macos"))'.dependencies]
softbuffer = "0.4"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
panic = "abort"
