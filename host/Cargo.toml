[package]
name = "desktop-widgets"
version = "0.1.0"
edition = "2021"
description = "Desktop widgets host: native capsule casings, snapping, shade mode, docks."
license = "MIT"

[[bin]]
name = "desktop-widgets"
path = "src/main.rs"

[dependencies]
winit = "0.30"
softbuffer = "0.4"
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd"] }
fontdue = "0.9"
wry = "0.57"
tray-icon = "0.26"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
dirs = "6"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSGeometry", "NSArray", "NSString", "NSUserDefaults", "NSDictionary", "NSValue"] }
objc2-app-kit = { version = "0.3", features = ["NSScreen", "NSApplication", "NSRunningApplication", "NSWorkspace", "NSResponder", "NSWindow", "NSView", "NSGraphics", "NSColor"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
panic = "abort"
